<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />

  <title>Canciones</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="canciones.css" />
</head>
<body>
  <header class="app-header">
    <div class="container header-row">
      <div>
        <h1>Canciones</h1>
        <p>Biblioteca de canciones en PDF.</p>
      </div>

      <nav class="top-nav">
        <a href="index.html">Inicio</a>
      </nav>
    </div>
  </header>

  <main class="container songs-page">
    <section class="songs-layout">

      <aside class="panel songs-sidebar">
        <h2>Biblioteca</h2>

        <div class="form-group">
          <label for="song-search">Buscar</label>

          <input
            type="text"
            id="song-search"
            placeholder="Buscar por artista o canción"
          />
        </div>

        <div id="songs-list" class="songs-list"></div>
      </aside>

      <section class="panel songs-viewer-panel">

        <div id="song-viewer-empty" class="songs-empty-state">
          Selecciona una canción para verla aquí.
        </div>

        <div id="song-tools" class="song-tools hidden">

          <div class="song-tools-row">
            <div class="song-actions">
              <button type="button" id="edit-song-btn">
                Editar
              </button>

              <button
                type="button"
                class="danger"
                id="delete-song-btn"
              >
                Eliminar
              </button>
            </div>
          </div>

          <form id="song-edit-form" class="song-edit-form hidden">

            <div class="song-edit-grid">

              <div class="form-group">
                <label for="edit-song-title">
                  Nombre de la canción
                </label>

                <input
                  type="text"
                  id="edit-song-title"
                  required
                />
              </div>

              <div class="form-group">
                <label for="edit-song-artist">
                  Artista
                </label>

                <input
                  type="text"
                  id="edit-song-artist"
                />
              </div>

              <div class="form-group">
                <label for="edit-song-duration">Duración</label>
                <input
                  type="text"
                  id="edit-song-duration"
                  placeholder="Ej: 3:45"
                />
              </div>

            </div>

            <div class="form-group">
              <label for="edit-song-pdf">
                Cambiar PDF
              </label>

              <input
                type="file"
                id="edit-song-pdf"
                accept="application/pdf,.pdf"
              />
            </div>

            <div class="song-edit-actions">
              <button type="submit">
                Guardar cambios
              </button>

              <button
                type="button"
                class="secondary"
                id="cancel-edit-btn"
              >
                Cancelar
              </button>
            </div>

          </form>

        </div>

        <div id="song-viewer" class="song-viewer hidden"></div>

      </section>

    </section>
  </main>

  <script src="songs-data.js"></script>
  <script src="canciones.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>
</body>
</html>
